[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vkaalnarsi-histaudit"
version = "0.1.0"
description = "只读审阅 shell 历史，分开高频与危险写法"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vkaalnarsi" }]
keywords = ["shell", "history", "audit", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/vkaalnarsi/histaudit"
Repository = "https://github.com/vkaalnarsi/histaudit"
Issues = "https://github.com/vkaalnarsi/histaudit/issues"

[project.scripts]
histaudit = "histaudit:main"

[tool.setuptools]
py-modules = ["histaudit"]
